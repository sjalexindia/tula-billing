name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p packages/core && npx tsc --noEmit -p packages/db && npx tsc --noEmit -p apps/server && npx tsc --noEmit -p apps/web
      - run: npm test
      - run: npm run test:phone -w apps/server
      - run: npm run build -w apps/web
      - run: npm run build:phone -w apps/web

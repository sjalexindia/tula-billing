# Builds the Tula Android app (debug APK): Tula on the phone itself, plus the connect page for
# opening it from the shop computer. Attaches the APK to the run as an artifact.
# Uses the Android SDK that comes preinstalled on GitHub's Ubuntu 24.04 runner
# (android-actions/setup-android failed on the newer ubuntu-latest image). See docs/07-sync-and-phones.md.
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*', 'android-*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build the phone app (Tula on the phone + the connect page)
        run: npm run build:phone

      - name: Copy the phone app and config into the Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/tula-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tula-android-debug
          path: apps/web/out/*.apk
          if-no-files-found: error
          retention-days: 30
